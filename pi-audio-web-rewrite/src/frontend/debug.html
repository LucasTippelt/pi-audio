<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi Audio / Debug</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Mono', 'Fira Code', monospace; background: #1a1a2e; color: #e0e0e0; padding: 2rem; line-height: 1.6; }
    h1 { color: #00ff88; margin-bottom: 0.5rem; font-size: 1.5rem; }
    .subtitle { color: #666; font-size: 0.85rem; margin-bottom: 1.5rem; }
    h2 { color: #00ccff; margin: 1.5rem 0 0.5rem; font-size: 1.1rem; border-bottom: 1px solid #333; padding-bottom: 0.3rem; }
    .section { margin-bottom: 2rem; }
    table { width: 100%; border-collapse: collapse; margin: 0.5rem 0; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.4rem 0.8rem; border-bottom: 1px solid #2a2a3e; }
    th { color: #888; width: 40%; font-weight: normal; }
    .ok { color: #00ff88; }
    .warn { color: #ffaa00; }
    .err { color: #ff4444; }
    pre { background: #0d0d1a; padding: 1rem; border-radius: 4px; overflow-x: auto; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; max-height: 300px; }
    a { color: #00ccff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 3px; font-size: 0.8rem; margin-right: 0.3rem; }
    .badge-ok { background: #003322; color: #00ff88; }
    .badge-err { background: #330011; color: #ff4444; }
    .badge-warn { background: #332200; color: #ffaa00; }
    .match-yes { color: #00ff88; }
    .match-no { color: #ff4444; }
    .match-na { color: #666; }

    /* Level meter */
    .meter-row { display: flex; align-items: center; gap: 1rem; margin: 0.3rem 0; }
    .meter-label { width: 80px; text-align: right; font-size: 0.85rem; color: #888; }
    .meter-bar-bg { flex: 1; height: 20px; background: #0d0d1a; border-radius: 3px; overflow: hidden; position: relative; }
    .meter-bar { height: 100%; border-radius: 3px; transition: width 0.3s ease, background 0.3s ease; min-width: 2px; }
    .meter-val { width: 70px; text-align: right; font-size: 0.8rem; color: #aaa; }

    /* Refresh bar */
    #refresh-bar { position: fixed; top: 0; left: 0; height: 2px; background: #00ff88; transition: width linear; z-index: 100; }
    #refresh-status { position: fixed; top: 0.5rem; right: 1rem; font-size: 0.75rem; color: #555; }

    /* Comparison table */
    .compare-table th:nth-child(3), .compare-table td:nth-child(3) { width: 20%; text-align: center; }
    .compare-table th:nth-child(4), .compare-table td:nth-child(4) { width: 10%; text-align: center; }

    /* Loading */
    #loading { color: #666; font-size: 0.9rem; }
    .hidden { display: none; }

    /* Side-by-side raw JSON panels */
    .raw-json-row { display: flex; gap: 1rem; margin-bottom: 2rem; }
    .raw-json-panel { flex: 1; min-width: 0; }
    .raw-json-panel h2 { color: #00ccff; font-size: 1.1rem; border-bottom: 1px solid #333; padding-bottom: 0.3rem; margin-bottom: 0.5rem; }
    .raw-json-panel pre { background: #0d0d1a; padding: 1rem; border-radius: 4px; overflow-x: auto; font-size: 0.78rem; white-space: pre-wrap; word-break: break-all; max-height: 350px; }
  </style>
</head>
<body>
  <div id="refresh-bar"></div>
  <div id="refresh-status">Auto-refresh: 5s</div>

  <h1>Pi Audio Debug</h1>
  <p class="subtitle"><a href="./">&larr; Back to main page</a></p>

  <div id="loading">Loading debug data...</div>
  <div id="content" class="hidden"></div>

<script>
const REFRESH_INTERVAL = 5000;

function badge(label, ok) {
  return `<span class="badge ${ok ? 'badge-ok' : 'badge-err'}">${label}</span>`;
}

function cls(val, truthy) {
  if (val === null || val === undefined || val === '') return 'warn';
  return truthy ? 'ok' : '';
}

function row(label, value, c = '') {
  return `<tr><th>${label}</th><td class="${c}">${value}</td></tr>`;
}

function section(title, html) {
  return `<div class="section"><h2>${title}</h2>${html}</div>`;
}

function levelMeter(label, dbVal, maxDb = 0, minDb = -80) {
  const clamped = Math.max(minDb, Math.min(maxDb, dbVal));
  const pct = Math.max(0, ((clamped - minDb) / (maxDb - minDb)) * 100);
  let color;
  if (clamped > -3) color = '#ff4444';
  else if (clamped > -12) color = '#ffaa00';
  else color = '#00ff88';
  return `<div class="meter-row">
    <span class="meter-label">${label}</span>
    <div class="meter-bar-bg"><div class="meter-bar" style="width:${pct}%;background:${color}"></div></div>
    <span class="meter-val">${dbVal.toFixed(1)} dB</span>
  </div>`;
}

function matchIcon(cfg, eng) {
  if (cfg === null || cfg === undefined || eng === null || eng === undefined) return '<span class="match-na">—</span>';
  const c = String(cfg);
  const e = String(eng);
  if (c === '—' || e === '—') return '<span class="match-na">—</span>';
  return c === e ? '<span class="match-yes">&#10003;</span>' : '<span class="match-no">&#10007;</span>';
}

function render(data) {
  const el = document.getElementById('content');
  let h = '';

  // --- DSP Connection Status (1) ---
  let dspHtml = '<table>\n';
  const ds = data.dspStatus;
  dspHtml += row('Connected', ds.connected ? 'Yes' : 'No', ds.connected ? 'ok' : 'warn');
  dspHtml += row('Sample Rate', (ds.sampleRate ?? '\u2014') + ' Hz');
  dspHtml += row('Buffer Size', (ds.BufferSize ?? '\u2014') + ' frames');
  if (data.statusMessage) dspHtml += row('Status Message', escHtml(data.statusMessage));
  dspHtml += '</table>';
  h += section('DSP Connection Status', dspHtml);

  // --- Services (2) ---
  let svcHtml = '<table>\n';
  for (const s of data.services) {
    svcHtml += row(s.name, badge(s.active ? 'active' : 'inactive', s.active), s.active ? 'ok' : '');
  }
  svcHtml += '</table>';
  h += section('Services', svcHtml);

  // --- Binaries (3) ---
  let binHtml = '<table>\n';
  for (const b of data.binaries) {
    const st = b.exists ? (b.executable ? 'exists | executable' : 'exists | NOT executable') : 'MISSING';
    const c = b.executable ? 'ok' : (b.exists ? 'warn' : 'err');
    binHtml += row(b.name, `${st}\n<small style="color:#666">${b.path}</small>`, c);
  }
  binHtml += '</table>';
  h += section('Binaries', binHtml);

  // --- Output Levels (4) ---
  let lvlHtml = '';
  if (data.engineState && Array.isArray(data.engineState.outputLevelDb)) {
    const levels = data.engineState.outputLevelDb;
    lvlHtml += levelMeter('L', levels[0] ?? -80);
    lvlHtml += levelMeter('R', levels[1] ?? -80);
  } else {
    lvlHtml = '<p class="warn">No output level data available.</p>';
  }
  h += section('Output Levels (Live)', lvlHtml);

  // --- Engine Telemetry (5) ---
  let telHtml = '';
  if (data.engineState) {
    const e = data.engineState;
    let t = '<table>\n';
    t += row('Sequence', e.seq ?? '\u2014');
    t += row('XRun Underrun', Number(e.xrunUnderrun ?? 0).toLocaleString());
    t += row('XRun Overrun', Number(e.xrunOverrun ?? 0).toLocaleString());
    const clockLabels = { 0: 'Unknown', 1: 'Idle', 2: 'Running', 3: 'Synced', 4: 'Wrong' };
    t += row('Clock State', (clockLabels[e.clockState] || e.clockState) + ` (${e.clockState})`);
    t += row('Latency Frames', Number(e.latencyFrames ?? 0).toLocaleString());
    t += row('Sample Index', typeof e.sampleIndex !== 'undefined' ? Number(e.sampleIndex).toLocaleString() : '\u2014');
    t += '</table>';
    telHtml = t;
  } else {
    telHtml = '<p class="warn">Engine state not available.</p>';
  }
  h += section('Engine Telemetry', telHtml);

  // --- Engine State vs Config (6) ---
  let cmpHtml = '';
  if (data.engineState && data.currentConfig) {
    const fields = [
      ['input', 'Input Device'],
      ['output', 'Output Device'],
      ['sampleRate', 'Sample Rate'],
      ['BufferSize', 'Buffer Size'],
      ['volume', 'Volume'],
      ['muted', 'Muted'],
    ];
    let t = '<table class="compare-table">\n';
    t += '<tr><th>Parameter</th><th>Config File</th><th>Engine State</th><th>Match</th></tr>\n';
    for (const [key, label] of fields) {
      const cv = data.currentConfig[key] ?? '\u2014';
      const ev = data.engineState[key] ?? '\u2014';
      const cs = typeof cv === 'boolean' ? (cv ? 'true' : 'false') : String(cv);
      const es = typeof ev === 'boolean' ? (ev ? 'true' : 'false') : String(ev);
      t += `<tr><th>${label}</th><td>${escHtml(cs)}</td><td>${escHtml(es)}</td><td>${matchIcon(cv, ev)}</td></tr>\n`;
    }
    t += '</table>';
    cmpHtml = t;
  } else {
    cmpHtml = '<p class="warn">Engine state or config not available for comparison.</p>';
  }
  h += section('Engine State vs Config (Apply Verification)', cmpHtml);

  // --- Current Configuration (7) ---
  let curHtml = '';
  if (data.currentConfig) {
    let t = '<table>\n';
    const c = data.currentConfig;
    t += row('Input Device', c.input || '\u2014');
    t += row('Output Device', c.output || '\u2014');
    t += row('Sample Rate', (c.sampleRate ?? '\u2014') + ' Hz');
    t += row('Buffer Size', (c.BufferSize ?? '\u2014') + ' frames');
    t += row('Volume', (c.volume ?? '\u2014') + '%');
    t += row('Muted', c.muted ? 'Yes' : 'No');
    if (c.limiter && typeof c.limiter === 'object') {
      t += row('Limiter', `enabled: ${c.limiter.enabled ? 'Yes' : 'No'}, threshold: ${c.limiter.threshold ?? '\u2014'} dB, release: ${c.limiter.release ?? '\u2014'} ms`);
    }
    if (Array.isArray(c.drivers)) {
      const d = c.drivers.map(d => `${d.name || '?'} (delay: ${d.delayMs ?? 0}ms, trim: ${d.trimDb ?? 0}dB)`).join('\n');
      t += `<tr><th>Drivers</th><td><pre>${escHtml(d)}</pre></td></tr>\n`;
    }
    if (c.bands && typeof c.bands === 'object') {
      const b = Object.entries(c.bands).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.length : 0} bands`).join('\n');
      t += `<tr><th>Bands</th><td><pre>${escHtml(b)}</pre></td></tr>\n`;
    }
    t += '</table>';
    curHtml = t;
  } else {
    curHtml = '<p class="err">current.json not found or invalid</p>';
  }
  h += section('Current Configuration (current.json)', curHtml);

  // --- Raw JSON side-by-side (8) ---
  let rawLeft = data.engineState ? escHtml(JSON.stringify(data.engineState, null, 2)) : '(not available)';
  let rawRight = data.rawCurrentConfig ? escHtml(data.rawCurrentConfig) : '(not available)';
  h += `<div class="raw-json-row">
    <div class="raw-json-panel"><h2>Raw engine-state.json</h2><pre>${rawLeft}</pre></div>
    <div class="raw-json-panel"><h2>Raw current.json</h2><pre>${rawRight}</pre></div>
  </div>`;

  // --- ALSA (9) ---
  let alsaHtml = '<table>\n';
  if (data.soundCards) alsaHtml += `<tr><th>Sound Cards</th><td><pre>${escHtml(data.soundCards)}</pre></td></tr>\n`;
  else alsaHtml += row('Sound Cards', '(none)', 'warn');
  if (data.amixerControls) alsaHtml += `<tr><th>Mixer Controls</th><td><pre>${escHtml(data.amixerControls)}</pre></td></tr>\n`;
  else alsaHtml += row('Mixer Controls', '(none)', 'warn');
  alsaHtml += '</table>';
  h += section('ALSA', alsaHtml);

  // --- Presets (10) ---
  let preHtml = '<table>\n';
  preHtml += `<tr><th>Total</th><td>${data.presetFiles.length} files</td></tr>\n`;
  for (const p of data.presetFiles) {
    preHtml += row(p.name, `${p.size} bytes | ${new Date(p.mtime).toLocaleString()}`);
  }
  if (data.presetFiles.length === 0) preHtml += '<tr><td colspan="2" class="warn">No presets found</td></tr>\n';
  preHtml += '</table>';
  h += section('Presets', preHtml);

  // --- File Permissions (11) ---
  let permHtml = '<table>\n';
  for (const p of data.permissions) {
    if (p.exists && p.perms) {
      const wCls = p.writable ? 'ok' : 'warn';
      permHtml += row(p.path, `${p.perms} [${p.writable ? 'w' : '-'}]`, wCls);
    } else {
      permHtml += row(p.path, '(not found)', 'warn');
    }
  }
  permHtml += '</table>';
  h += section('File Permissions', permHtml);

  // --- Configuration Files (12) ---
  let cfgHtml = '<table>\n';
  cfgHtml += row('Config Dir Exists', data.configDirExists ? 'Yes' : 'No', cls(null, data.configDirExists));
  cfgHtml += row('Config Writable', data.configDirWritable ? 'Yes' : 'No', cls(null, data.configDirWritable));
  cfgHtml += row('Presets Dir Exists', data.presetsDirExists ? 'Yes' : 'No', cls(null, data.presetsDirExists));
  cfgHtml += row('Presets Writable', data.presetsDirWritable ? 'Yes' : 'No', cls(null, data.presetsDirWritable));
  cfgHtml += '</table>';
  h += section('Configuration Files', cfgHtml);

  // --- Build Versions (13) ---
  let verHtml = '<table>\n';
  const engVer = data.engineState ? (data.engineState.version || '?') : '(not running)';
  verHtml += row('Web Server', data.webVersion, data.webVersion !== 'unknown' ? 'ok' : 'warn');
  verHtml += row('Audio Engine', engVer, engVer !== '(not running)' ? 'ok' : 'warn');
  if (data.webVersion !== 'unknown' && engVer !== '(not running)') {
    const match = data.webVersion === String(engVer);
    verHtml += row('Version Match', match ? 'Yes' : 'MISMATCH', match ? 'ok' : 'err');
  }
  verHtml += row('Node.js', data.nodeVersion || '(unknown)', data.nodeVersion ? 'ok' : 'warn');
  verHtml += '</table>';
  h += section('Build Versions', verHtml);

  // --- Environment Variables (14) ---
  let envHtml = '<table>\n';
  for (const [k, v] of Object.entries(data.env)) {
    envHtml += row(k, v || '(not set)', v ? 'ok' : 'warn');
  }
  if (Object.keys(data.env).length === 0) envHtml += '<tr><td colspan="2" class="warn">No environment variables set</td></tr>\n';
  envHtml += '</table>';
  h += section('Environment Variables', envHtml);

  el.innerHTML = h;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function fetchData() {
  try {
    const res = await fetch('/api/debug');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    render(data);
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');
  } catch (e) {
    console.error('Debug fetch failed:', e);
  }
}

// Auto-refresh with progress bar
(function() {
  let start = Date.now();
  const bar = document.getElementById('refresh-bar');
  const status = document.getElementById('refresh-status');
  function tick() {
    const elapsed = Date.now() - start;
    const pct = Math.min(100, (elapsed / REFRESH_INTERVAL) * 100);
    bar.style.width = pct + '%';
    const remaining = Math.max(0, Math.ceil((REFRESH_INTERVAL - elapsed) / 1000));
    status.textContent = `Refresh in ${remaining}s`;
    if (elapsed >= REFRESH_INTERVAL) {
      start = Date.now();
      fetchData();
    } else {
      requestAnimationFrame(tick);
    }
  }
  fetchData();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
