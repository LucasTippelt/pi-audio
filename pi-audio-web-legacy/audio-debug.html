<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Pi Audio / Debug Audio Monitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Mono', monospace, system-ui; background: #1a1a1a; color: #e0e0e0; padding: 2rem; }
    h1 { font-size: 1.4rem; margin-bottom: 1rem; color: #8a9b4a; }
    .panel { background: #2a2a2a; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
    .controls { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
    button {
      background: #8a9b4a; color: #1a1a1a; border: none; padding: 0.6rem 1.2rem;
      border-radius: 4px; font-family: inherit; font-weight: 600; cursor: pointer; font-size: 0.85rem;
    }
    button:hover { background: #9ab55a; }
    button:disabled { background: #555; color: #888; cursor: not-allowed; }
    button.stop { background: #c0392b; color: #fff; }
    button.stop:hover { background: #e74c3c; }
    button.clear-log { background: #555; color: #ccc; }
    button.clear-log:hover { background: #666; }
    .status { font-size: 0.8rem; color: #888; margin-top: 0.5rem; }
    .status.active { color: #8a9b4a; }
    .status.error { color: #e74c3c; }
    .ch-select { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
    .ch-select label {
      font-size: 0.75rem; color: #aaa; display: flex; align-items: center; gap: 0.3rem;
      background: #333; padding: 0.3rem 0.6rem; border-radius: 3px; cursor: pointer;
    }
    .ch-select input[type="radio"] { accent-color: #8a9b4a; }
    .ch-select label.active-ch { background: #4a5a2a; color: #c0d080; }
    .vol-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1rem; }
    .vol-row label { font-size: 0.75rem; color: #888; white-space: nowrap; }
    .vol-row input[type="range"] { flex: 1; max-width: 200px; accent-color: #8a9b4a; }
    .vol-row .vol-val { font-size: 0.8rem; color: #c0d080; min-width: 3.5em; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.5rem; }
    .metric { background: #333; padding: 0.6rem; border-radius: 4px; }
    .metric-label { font-size: 0.7rem; color: #888; text-transform: uppercase; }
    .metric-value { font-size: 1.1rem; color: #e0e0e0; margin-top: 0.2rem; }
    canvas { width: 100%; height: 120px; background: #222; border-radius: 4px; margin-top: 0.5rem; }
    .back { display: inline-block; margin-top: 1rem; color: #8a9b4a; text-decoration: none; font-size: 0.85rem; }
    .back:hover { text-decoration: underline; }
    .info { font-size: 0.75rem; color: #666; margin-top: 0.3rem; line-height: 1.4; }
    .log-panel { background: #111; border-radius: 4px; padding: 0.75rem; margin-top: 0.5rem; max-height: 220px; overflow-y: auto; font-size: 0.7rem; line-height: 1.5; }
    .log-panel .lg { color: #e74c3c; }
    .log-panel .ls { color: #8a9b4a; }
    .log-panel .lw { color: #3498db; }
    .log-ctrl { display: flex; gap: 0.7rem; align-items: center; margin-top: 0.5rem; flex-wrap: wrap; }
    .log-ctrl label { font-size: 0.7rem; color: #888; display: flex; align-items: center; gap: 0.3rem; cursor: pointer; }
    .log-ctrl input[type="checkbox"] { accent-color: #8a9b4a; }
  </style>
</head>
<body>
  <h1>Debug Audio Monitor</h1>
  <div class="panel">
    <div class="controls">
      <button id="btn-start" onclick="startStream()">Start Monitor</button>
      <button id="btn-stop" class="stop" onclick="stopStream()" disabled>Stop</button>
      <span id="status" class="status">Idle</span>
    </div>
    <div class="ch-select">
      <span style="font-size:0.75rem;color:#888;">TRANSPORT:</span>
      <label><input type="radio" name="transport" value="ws" checked> WebSocket (port 8765) <span style="color:#8a9b4a;font-size:0.65rem;">Stability</span></label>
      <label><input type="radio" name="transport" value="http"> HTTP Stream (port 8767) <span style="color:#3498db;font-size:0.65rem;">Lower Latency</span></label>
    </div>
    <div class="ch-select">
      <span style="font-size:0.75rem;color:#888;">MONITOR:</span>
      <label><input type="radio" name="monitor-ch" value="pgm-l"> PGM L</label>
      <label><input type="radio" name="monitor-ch" value="pgm-r"> PGM R</label>
      <label><input type="radio" name="monitor-ch" value="tweeter" checked> Tweeter</label>
      <label><input type="radio" name="monitor-ch" value="woofer"> Woofer</label>
      <label><input type="radio" name="monitor-ch" value="mic-1"> Mic 1</label>
      <label><input type="radio" name="monitor-ch" value="mic-2"> Mic 2</label>
      <label><input type="radio" name="monitor-ch" value="mic-3"> Mic 3</label>
      <label><input type="radio" name="monitor-ch" value="mic-4"> Mic 4</label>
      <label><input type="radio" name="monitor-ch" value="mic-5"> Mic 5</label>
      <label><input type="radio" name="monitor-ch" value="mic-6"> Mic 6</label>
    </div>
    <div class="vol-row">
      <label for="vol-slider">MONITOR GAIN:</label>
      <input type="range" id="vol-slider" min="0" max="200" value="50" step="1" oninput="setVolume(this.value)">
      <span class="vol-val" id="vol-val">50%</span>
    </div>
    <div class="metrics">
      <div class="metric"><div class="metric-label">Sample Rate</div><div class="metric-value" id="m-sr">&mdash;</div></div>
      <div class="metric"><div class="metric-label">Buffer Size</div><div class="metric-value" id="m-bs">&mdash;</div></div>
      <div class="metric"><div class="metric-label">Ring Buffer</div><div class="metric-value" id="m-queue">&mdash;</div></div>
      <div class="metric"><div class="metric-label">RMS Level</div><div class="metric-value" id="m-rms">&mdash;</div></div>
      <div class="metric"><div class="metric-label">Chunks</div><div class="metric-value" id="m-chunks">0</div></div>
      <div class="metric"><div class="metric-label">Gaps</div><div class="metric-value" id="m-gaps">0</div></div>
      <div class="metric"><div class="metric-label" title="Ring buffer + scheduled audio + browser-reported output delay; excludes network transit and acoustic loopback">Estimated Output Latency</div><div class="metric-value" id="m-latency">&mdash;</div></div>
      <div class="metric"><div class="metric-label">Drop Frames</div><div class="metric-value" id="m-drops">0</div></div>
      <div class="metric"><div class="metric-label">Stream Gap</div><div class="metric-value" id="m-streamgap">0</div></div>
    </div>
    <canvas id="waveform"></canvas>
    <div class="log-ctrl">
      <button class="clear-log" onclick="clearLog()">Clear</button>
      <button class="clear-log" onclick="copyLog()">Copy</button>
      <label><input type="checkbox" id="lg-gaps" checked> Gaps</label>
      <label><input type="checkbox" id="lg-sched" checked> Schedule</label>
      <label><input type="checkbox" id="lg-http"> HTTP msgs</label>
      <label><input type="checkbox" id="lg-cb" checked> Callback</label>
      <label><input type="checkbox" id="lg-info" checked> Info</label>
    </div>
    <div class="log-panel" id="log-panel"></div>
    <div class="info">WebSocket (port 8765): frame-based, no TCP batching. HTTP stream (port 8767): chunked transfer encoding.</div>
  </div>
  <a class="back" href="index.php">&larr; Back to main UI</a>
  <script>
    var audioCtx = null, gainNode = null, running = false;
    var chunkCount = 0, dropCount = 0, gapCount = 0, sampleRate = 48000, bufferSize = 512;
    var waveData = new Float32Array(2048);
    var monitorGain = 0.5;
    var lastChunkTime = 0, maxStreamGap = 0, streamGapCount = 0;
    var lastScheduleTime = 0;
    var byteAccum = new Uint8Array(0);

    function updateBsDisplay() { document.getElementById('m-bs').textContent = bufferSize + ' frames'; }

    var HTTP_HOST = location.hostname || '127.0.0.1';
    var HTTP_PORT = 8767;
    var WS_PORT = 8765;
    var ws = null;

    /* Pull-based audio ring buffer: WebSocket/HTTP data writes to this
       buffer as it arrives (bursty or not). A ScriptProcessorNode reads
       continuously at the audio clock rate, so bursty delivery produces
       smooth playback with silence fill when the buffer runs dry. */
    var audioRing = new Float32Array(48000 * 4);  // 4s at 48kHz
    var ringWrite = 0;  // next write index (mod ring length)
    var ringRead = 0;   // next read index (mod ring length)
    var ringCount = 0;  // samples currently in ring
    var httpAbort = null;   // AbortController for HTTP fetch
    var httpReader = null;  // ReadableStreamDefaultReader for HTTP

    function selCh() { var s = document.querySelector('input[name="monitor-ch"]:checked'); return s ? s.value : null; }
    function setStatus(t, st) { var e = document.getElementById('status'); e.textContent = t; e.className = 'status' + (st ? ' ' + st : ''); }
    function setVolume(v) { monitorGain = v / 100; document.getElementById('vol-val').textContent = v + '%'; if (gainNode) gainNode.gain.value = monitorGain; }

    function ts() { return (performance.now() / 1000).toFixed(3); }
    function addLog(text, cls) {
      var p = document.getElementById('log-panel'), l = document.createElement('div');
      l.className = ' ' + (cls || ''); l.textContent = '[' + ts() + '] ' + text;
      p.appendChild(l); while (p.children.length > 500) p.removeChild(p.firstChild);
      p.scrollTop = p.scrollHeight;
    }
    function logIf(text, cls, chkId) { if (document.getElementById(chkId).checked) addLog(text, cls); }
    function clearLog() { document.getElementById('log-panel').innerHTML = ''; }
    function copyLog() {
      var p = document.getElementById('log-panel'), t = '';
      for (var i = 0; i < p.children.length; i++) t += p.children[i].textContent + '\n';
      navigator.clipboard.writeText(t.trim()).then(function() { addLog('Log copied', 'ls'); }).catch(function() {});
    }

    function updateRMS(f, n) {
      var s = 0, sc = Math.min(n, 2048);
      for (var i = 0; i < sc; i++) { s += f[i] * f[i]; if (i < waveData.length) waveData[i] = f[i]; }
      var r = Math.sqrt(s / Math.max(1, sc));
      document.getElementById('m-rms').textContent = (20 * Math.log10(Math.max(1e-10, r))).toFixed(1) + ' dB';
    }

    function updateMetrics() {
      if (!audioCtx || !running) return;
      var ringMs = ringCount / sampleRate * 1000;
      var scheduledMs = Math.max(0, nextScheduleTime - audioCtx.currentTime) * 1000;
      var deviceMs = ((audioCtx.baseLatency || 0) + (audioCtx.outputLatency || 0)) * 1000;
      document.getElementById('m-queue').textContent = ringMs.toFixed(0) + ' ms';
      document.getElementById('m-latency').textContent = (ringMs + scheduledMs + deviceMs).toFixed(0) + ' ms';
      document.getElementById('m-gaps').textContent = gapCount;
      document.getElementById('m-drops').textContent = dropCount;
      if (streamGapCount > 0) {
        document.getElementById('m-streamgap').textContent = (maxStreamGap / streamGapCount).toFixed(0) + ' ms avg';
      }
    }

    function writeToAudioRing(floatData) {
      var len = floatData.length;
      var space = audioRing.length - ringCount;
      if (len > space) {
        dropCount += len - space;
        len = space;
      }
      for (var i = 0; i < len; i++) {
        audioRing[(ringWrite + i) % audioRing.length] = floatData[i];
      }
      ringWrite = (ringWrite + len) % audioRing.length;
      ringCount += len;
    }

    var retryCount = 0, maxRetries = 10;

    function selTransport() { var s = document.querySelector('input[name="transport"]:checked'); return s ? s.value : 'http'; }

    function startStream() {
      if (running) return;
      running = true; chunkCount = 0; dropCount = 0; gapCount = 0;
      waveData.fill(0); maxStreamGap = 0; streamGapCount = 0;
      byteAccum = new Uint8Array(0); lastScheduleTime = 0;
      ringWrite = 0; ringRead = 0; ringCount = 0;
      bufferSize = 512;
      audioRing.fill(0);
      document.getElementById('btn-start').disabled = true;
      document.getElementById('btn-stop').disabled = false;
      document.getElementById('m-chunks').textContent = '0';
      document.getElementById('m-gaps').textContent = '0';
      document.getElementById('m-queue').textContent = '\u2014';
      document.getElementById('m-rms').textContent = '\u2014';
      clearLog();
      var transport = selTransport();
      if (transport === 'ws') {
        startWebSocket();
      } else {
        startHttpStream();
      }
    }

    function startHttpStream() {
      var ch = selCh();
      if (!ch) { setStatus('No channel', 'error'); return; }

      addLog('HTTP transport: http://' + HTTP_HOST + ':' + HTTP_PORT, '');
      setStatus('Getting engine status...', 'active');

      var statusUrl = 'http://' + HTTP_HOST + ':' + HTTP_PORT + '/status';
      addLog('Fetching ' + statusUrl, '');

      fetch(statusUrl)
        .then(function(r) {
          addLog('Status response: ' + r.status + ' ' + r.statusText, 'ls');
          return r.json();
        })
        .then(function(d) {
          addLog('Status JSON: sampleRate=' + d.sampleRate + ' bufferSize=' + d.BufferSize, '');
          sampleRate = d.sampleRate || 48000;
          bufferSize = d.BufferSize || 512;
          updateBsDisplay();
          document.getElementById('m-sr').textContent = (sampleRate / 1000).toFixed(1) + ' kHz';
          initAudio(sampleRate, bufferSize);
          connectHttpStream(ch);
        })
        .catch(function(e) {
          addLog('Status fetch failed: ' + e.name + ' — ' + e.message, 'lg');
          addLog('Engine may not be running or port ' + HTTP_PORT + ' is blocked', 'lg');
          addLog('Check: journalctl -u pi-audio-engine -n 20', '');
          if (retryCount < maxRetries) {
            retryCount++;
            addLog('Retrying in 3s (attempt ' + retryCount + '/' + maxRetries + ')', 'lw');
            setTimeout(function() { if (running) startHttpStream(); }, 3000);
          } else {
            setStatus('Gave up after ' + maxRetries + ' retries', 'error');
            running = false;
            document.getElementById('btn-start').disabled = false;
            document.getElementById('btn-stop').disabled = true;
          }
        });
    }

    function startWebSocket() {
      var ch = selCh();
      if (!ch) { setStatus('No channel', 'error'); return; }

      addLog('WebSocket transport: ws://' + HTTP_HOST + ':' + WS_PORT, '');
      setStatus('Connecting WebSocket...', 'active');

      var wsUrl = 'ws://' + HTTP_HOST + ':' + WS_PORT + '?ch=' + encodeURIComponent(ch);
      ws = new WebSocket(wsUrl);
      ws.binaryType = 'arraybuffer';

      ws.onopen = function() {
        addLog('WebSocket connected', 'ls');
        var msg = JSON.stringify({channel: ch});
        addLog('Subscribe: ' + msg, '');
        ws.send(msg);
      };

      ws.onmessage = function(event) {
        addLog('WS msg type=' + typeof event.data + ' ctor=' + (event.data ? event.data.constructor.name : 'null'), 'ls');

        if (typeof event.data === 'string') {
          addLog('WS string msg: ' + event.data, 'ls');
          var ack = JSON.parse(event.data);
          addLog('WS ack ok=' + ack.ok + ' sr=' + ack.sampleRate + ' bs=' + ack.bufferSize, 'ls');
            if (ack.ok) {
            addLog('Subscribed: sr=' + ack.sampleRate + ' bs=' + ack.bufferSize, 'ls');
            sampleRate = ack.sampleRate || 48000;
            bufferSize = ack.bufferSize || 512;
            updateBsDisplay();
            document.getElementById('m-sr').textContent = (sampleRate / 1000).toFixed(1) + ' kHz';
            initAudio(sampleRate, bufferSize);
          } else {
            addLog('Subscribe failed: ' + (ack.error || 'unknown'), 'lg');
            setStatus('Subscribe failed', 'error');
            stopStream();
          }
          return;
        }

        if (event.data instanceof ArrayBuffer) {
          /* Try decode as JSON text first (server may send ack as binary frame) */
          var text = '';
          try {
            var firstByte = new Uint8Array(event.data, 0, 1)[0];
            if (firstByte === 123) { // '{' - likely JSON
              text = new TextDecoder().decode(event.data);
              var ack = JSON.parse(text);
              addLog('WS ack(from binary) ok=' + ack.ok + ' sr=' + ack.sampleRate, 'ls');
                if (ack.ok) {
                sampleRate = ack.sampleRate || 48000;
                bufferSize = ack.bufferSize || 512;
                updateBsDisplay();
                document.getElementById('m-sr').textContent = (sampleRate / 1000).toFixed(1) + ' kHz';
                initAudio(sampleRate, bufferSize);
              }
              return;
            }
          } catch(e) {}

          var floats = new Float32Array(event.data);
          var now = performance.now();
          var gapMs = lastChunkTime > 0 ? now - lastChunkTime : 0;
          lastChunkTime = now;
          var expectedMs = 1000.0 * floats.length / sampleRate;
          var lateMs = gapMs - expectedMs;
          if (lateMs > 2) { maxStreamGap = Math.max(maxStreamGap, lateMs); streamGapCount++; }
          var rms = 0;
          for (var ri = 0; ri < floats.length; ri++) rms += floats[ri] * floats[ri];
          rms = Math.sqrt(rms / floats.length);
          var rmsDb = (20 * Math.log10(Math.max(1e-10, rms))).toFixed(1);
          logIf('WS ' + floats.length + 'f gap=' + gapMs.toFixed(1) + 'ms late=' + lateMs.toFixed(1) + 'ms rms=' + rmsDb + 'dB', 'lw', 'lg-http');
          updateRMS(floats, floats.length);
          writeToAudioRing(floats);
          var ringMs = (ringCount / sampleRate * 1000).toFixed(0);
          logIf('WS ring=' + ringMs + 'ms', 'lw', 'lg-cb');
          chunkCount++;
          document.getElementById('m-chunks').textContent = chunkCount;
          updateMetrics();
        }
      };

      ws.onerror = function(e) {
        addLog('WebSocket error', 'lg');
      };

      ws.onclose = function(e) {
        addLog('WebSocket closed (code=' + e.code + ')', 'lw');
        if (running) {
          setStatus('Disconnected, retrying...', 'error');
          setTimeout(function() { if (running) startWebSocket(); }, 200);
        }
      };
    }

    function onWsAudioData(floatData) {
      if (!running) return;
      updateRMS(floatData, floatData.length);
      writeToAudioRing(floatData);
      chunkCount++;
      document.getElementById('m-chunks').textContent = chunkCount;
      updateMetrics();
    }

    /* Shared audio graph: AudioContext + GainNode.
       Audio is scheduled from the ring buffer at a steady rate using
       AudioBufferSourceNode scheduling — the ring absorbs bursty delivery
       and the scheduler maintains a continuous playback chain. */
    var nextScheduleTime = 0;
    var scheduleInterval = null;

    function initAudio(sr, bs) {
      addLog('initAudio called sr=' + sr + ' bs=' + bs, 'ls');
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: sr });
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(function() {
          addLog('AudioContext resumed', 'ls');
        });
      }
      gainNode = audioCtx.createGain();
      gainNode.gain.value = monitorGain;
      gainNode.connect(audioCtx.destination);
      addLog('AudioCtx sr=' + sr + ' gain=' + monitorGain + ' state=' + audioCtx.state, 'ls');

      /* Adaptive scheduler parameters based on buffer period.
       * bufferPeriod = time between server pushes.
       * All thresholds scale so the scheduler stays in sync
       * regardless of sample rate or buffer size. */
       var bp = bs / sr * 1000;                    // buffer period in ms
       var ringKeep = Math.ceil(sr * bp / 1000 * (selTransport() === 'ws' ? 5 : 1));  // safety margin: 5 buffer periods (WS) or 1 (HTTP)
       var schedInterval = Math.max(10, Math.ceil(bp * (selTransport() === 'ws' ? 3 : 1)));  // tick every 3bp (WS) or 1bp (HTTP), min 10ms (browser floor)
       var headStartMax = ringKeep / sr * 1000 + 50;  // ringKeep in ms + 50ms margin
       var chunkMax = bs * Math.max(4, Math.ceil(sr * schedInterval / 1000 / bs * 1.5));  // drain 50% more than arrives per tick
       var initDelay = bp * 5 / 1000;               // initial schedule offset: 5 buffer periods

      if (scheduleInterval) clearInterval(scheduleInterval);
      nextScheduleTime = audioCtx.currentTime + initDelay;
      addLog('Scheduler: bp=' + bp.toFixed(1) + 'ms ringKeep=' + ringKeep + ' (' + (ringKeep/sr*1000).toFixed(0) + 'ms) interval=' + schedInterval + 'ms chunkMax=' + chunkMax + ' headMax=' + headStartMax.toFixed(0) + 'ms', 'ls');
      addLog('Scheduler start nextScheduleTime=' + nextScheduleTime.toFixed(3) + ' now=' + audioCtx.currentTime.toFixed(3), 'ls');

      scheduleInterval = setInterval(function() {
       if (!running || !audioCtx) return;
       var now = audioCtx.currentTime;
       if (nextScheduleTime < now) nextScheduleTime = now + initDelay;
       var headStart = (nextScheduleTime - now) * 1000;
       if (headStart > headStartMax) return;
       if (ringCount < ringKeep + bs) return;

       var chunkFrames = Math.min(chunkMax, ringCount - ringKeep);
       var audioBuffer = audioCtx.createBuffer(1, chunkFrames, sampleRate);
       var dst = audioBuffer.getChannelData(0);
       for (var i = 0; i < chunkFrames; i++) {
         dst[i] = audioRing[ringRead];
         ringRead = (ringRead + 1) % audioRing.length;
         ringCount--;
       }
       var src = audioCtx.createBufferSource();
       src.buffer = audioBuffer;
       src.connect(gainNode);
       src.start(nextScheduleTime);
       nextScheduleTime += audioBuffer.duration;
       var ringMs = (ringCount / sampleRate * 1000);
       addLog('SCHED now=' + now.toFixed(1) + ' head=' + headStart.toFixed(0) + 'ms ring=' + ringMs.toFixed(0) + 'ms sched=' + (audioBuffer.duration*1000).toFixed(0) + 'ms next=' + nextScheduleTime.toFixed(1), 'lw');
     }, schedInterval);

      setInterval(function() { if (running) updateMetrics(); }, 500);
    }

    function connectHttpStream(ch) {
      var url = 'http://' + HTTP_HOST + ':' + HTTP_PORT + '/stream?ch=' + encodeURIComponent(ch);
      addLog('Stream URL: ' + url, '');
      setStatus('Connecting to engine stream...', 'active');

      httpAbort = new AbortController();
      var signal = httpAbort.signal;

      fetch(url, { cache: 'no-store', signal: signal })
        .then(function(response) {
          addLog('Stream response: ' + response.status + ' ' + response.statusText, 'ls');
          addLog('Content-Type: ' + response.headers.get('content-type'), '');
          addLog('Transfer-Encoding: ' + response.headers.get('transfer-encoding'), '');
          if (!response.ok) throw new Error('HTTP ' + response.status + ' ' + response.statusText);
          if (!response.body) throw new Error('ReadableStream not supported');
          logIf('HTTP ' + response.status + ' connected', 'ls', 'lg-info');
          setStatus('Streaming audio...', 'active');

          httpReader = response.body.getReader();

          function readLoop() {
            return httpReader.read().then(function(result) {
              if (result.done) {
                logIf('Stream closed', 'li', 'lg-info');
                if (running) {
                  setStatus('Stream ended, retrying...', 'error');
                  setTimeout(function() { if (running) startStream(); }, 1000);
                }
                return;
              }

               var now = performance.now();
               var gapMs = lastChunkTime > 0 ? now - lastChunkTime : 0;
               lastChunkTime = now;
               logIf('HTTP TCP-read ' + result.value.length + 'B gap=' + gapMs.toFixed(0) + 'ms', 'lw', 'lg-http');

               /* Append to accumulator */
               var combined = new Uint8Array(byteAccum.length + result.value.length);
               combined.set(byteAccum);
               combined.set(result.value, byteAccum.length);
               byteAccum = combined;

               /* Process complete 4-byte frames */
               var frameBytes = byteAccum.length - (byteAccum.length % 4);
               if (frameBytes >= 4) {
                 var rawArr = byteAccum.subarray(0, frameBytes);
                 var floats = new Float32Array(rawArr.buffer, 0, rawArr.length / 4);
                 var floatCopy = new Float32Array(floats);
                 byteAccum = byteAccum.subarray(frameBytes);

                  var schedNow = performance.now();
                  var schedGap = lastScheduleTime > 0 ? schedNow - lastScheduleTime : 0;
                  lastScheduleTime = schedNow;
                  var expMs = 1000.0 * floatCopy.length / sampleRate;
                  var schedLate = schedGap - expMs;
                  if (schedLate > 2) { maxStreamGap = Math.max(maxStreamGap, schedLate); streamGapCount++; }
                  var rmsH = 0;
                  for (var ri = 0; ri < floatCopy.length; ri++) rmsH += floatCopy[ri] * floatCopy[ri];
                  rmsH = Math.sqrt(rmsH / floatCopy.length);
                  var rmsDbH = (20 * Math.log10(Math.max(1e-10, rmsH))).toFixed(1);
                  logIf('HTTP sched ' + floatCopy.length + 'f schedGap=' + schedGap.toFixed(1) + 'ms late=' + schedLate.toFixed(1) + 'ms rms=' + rmsDbH + 'dB', 'lw', 'lg-http');
                  updateRMS(floatCopy, floatCopy.length);
                  writeToAudioRing(floatCopy);
                  var ringMsH = (ringCount / sampleRate * 1000).toFixed(0);
                  logIf('HTTP ring=' + ringMsH + 'ms', 'lw', 'lg-cb');
                  chunkCount++;
                  document.getElementById('m-chunks').textContent = chunkCount;
                }
              updateMetrics();
              return readLoop();
            });
          }
          return readLoop();
        })
        .catch(function(e) {
          addLog('Stream error: ' + e.name + ' — ' + e.message, 'lg');
          if (e.name === 'TypeError' && e.message.indexOf('fetch') !== -1) {
            addLog('DIAGNOSIS: NetworkError — connection refused or blocked', 'lg');
            addLog('Possible causes:', 'lg');
            addLog('  1. Engine not running: systemctl status pi-audio-engine', 'lg');
            addLog('  2. Port ' + HTTP_PORT + ' not reachable: nc -zv ' + HTTP_HOST + ' ' + HTTP_PORT, 'lg');
            addLog('  3. Firewall blocking: ufw status / iptables -L', 'lg');
            addLog('  4. Engine bound to 127.0.0.1 instead of 0.0.0.0', 'lg');
            addLog('  5. BindsTo dependency: systemctl status pi-audio-ws-server', 'lg');
          }
          setStatus('Error: ' + e.message, 'error');
          if (running && retryCount < maxRetries) {
            retryCount++;
            addLog('Retrying stream in 2s (attempt ' + retryCount + '/' + maxRetries + ')', 'lw');
            setTimeout(function() { if (running) startStream(); }, 2000);
          } else if (retryCount >= maxRetries) {
            setStatus('Gave up after ' + maxRetries + ' retries', 'error');
            running = false;
            document.getElementById('btn-start').disabled = false;
            document.getElementById('btn-stop').disabled = true;
          }
        });
    }

    function stopStream() {
      running = false;
      retryCount = 0;
      ringWrite = 0; ringRead = 0; ringCount = 0;
      bufferSize = 512;
      audioRing.fill(0);
      byteAccum = new Uint8Array(0);
      if (scheduleInterval) { clearInterval(scheduleInterval); scheduleInterval = null; }
      if (ws) { try { ws.close(); } catch(e) {} ws = null; }
      if (httpReader) { try { httpReader.releaseLock(); } catch(e) {} httpReader = null; }
      if (httpAbort) { try { httpAbort.abort(); } catch(e) {} httpAbort = null; }
      if (gainNode) { try { gainNode.disconnect(); } catch(e) {} gainNode = null; }
      if (audioCtx) { audioCtx.close().catch(function() {}); audioCtx = null; }
      document.getElementById('btn-start').disabled = false;
      document.getElementById('btn-stop').disabled = true;
      setStatus('Stopped', '');
    }

    window.addEventListener('pagehide', stopStream);
    document.querySelectorAll('input[name="monitor-ch"]').forEach(function(el) {
      el.addEventListener('change', function() {
        document.querySelectorAll('input[name="monitor-ch"]').forEach(function(e) { e.closest('label').classList.toggle('active-ch', e.checked); });
        if (!running) return;
        stopStream();
        setTimeout(function() { startStream(); }, 200);
      });
    });
    document.querySelectorAll('input[name="monitor-ch"]').forEach(function(el) { el.closest('label').classList.toggle('active-ch', el.checked); });
    document.querySelectorAll('input[name="transport"]').forEach(function(el) {
      el.addEventListener('change', function() {
        if (!running) return;
        stopStream();
        setTimeout(function() { startStream(); }, 200);
      });
    });

    (function() {
      var canvas = document.getElementById('waveform'), c = canvas.getContext('2d');
      function draw() {
        var w = canvas.width = canvas.clientWidth * (window.devicePixelRatio || 1);
        var h = canvas.height = 120 * (window.devicePixelRatio || 1);
        c.fillStyle = '#1a1a1a'; c.fillRect(0, 0, w, h);
        c.strokeStyle = '#333'; c.lineWidth = 1; c.beginPath(); c.moveTo(0, h / 2); c.lineTo(w, h / 2); c.stroke();
        waveData.copyWithin(0, 3); waveData.fill(0, waveData.length - 3);
        for (var i = 0; i < waveData.length; i++) { waveData[i] *= 0.985; if (Math.abs(waveData[i]) < 1e-6) waveData[i] = 0; }
        c.strokeStyle = '#8a9b4a'; c.lineWidth = 1.5; c.beginPath();
        for (var x = 0; x < w; x++) {
          var v = waveData[Math.floor((x / w) * waveData.length)] || 0;
          var y = h / 2 - v * h / 2; x === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
        }
        c.stroke();
        var q = running ? (ringCount / sampleRate * 1000) : 0;
        var col = q > 200 ? 'rgba(138,155,74,0.6)' : 'rgba(200,80,60,0.5)';
        c.fillStyle = col; c.fillRect(0, h - 3, w * Math.min(1, q / 1000), 3);
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
</body>
</html>
